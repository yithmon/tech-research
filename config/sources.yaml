# Tech Blog Subscription Sources Configuration
# Used by weekly digest automation
#
# ─── fallback 字段约定（2026-10-31 新增，成本优化 + 采集健壮性）───
# 每个源可选 fallback 字段，是一个有序列表，抓取子 Agent 按顺序尝试，命中即停：
#   primary   : 首选紧凑端点（RSS/atom/feed），最快最省 credit
#   archive   : 主 feed 不可达时的网页降级入口（Substack/beehiiv 的 /archive 页
#               内嵌 newPostsForArchive/initial JSON，可静态解析出标题+日期+slug+canonical_url，
#               正文需再逐篇请求文章页）。已实测可达：evakeiffenheim / lg / latent.space
#   search    : 无稳定主页的源（X 封号迁移、公众号无固定镜像）用 WebSearch 搜近期标题，
#               命中虎嗅/网易/雪球等单篇镜像。标注为「事件驱动·二次来源」，非稳定端点。
#   规则：primary 失败 → 试 archive → 仍失败 → 试 search → 全失败才标『不可达』。
#   每源最多 2 次抓取尝试的护栏不变；fallback 只在 primary 失败时才消耗额外尝试。
# ⚠️ 教训（W44）：/feed fetch failed 时不要直接判『不可达』——archive 常能救回，
#    W44 Eva 实际有 10-28 新文却因 feed 失败被误标不可达。

