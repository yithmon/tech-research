# Early Radar（早期预警源）：不计入深读配额，只用于每周扫描「新面孔 / 弱信号」
# 由周五定时任务扫描。触发规则：同一项目/工具/人被 ≥2 个独立信源提及（两源触发）
# → 升级为「本月值得动手试」候选，记入当期周刊「跨源信号」节。
#
# [2026-10-10 成本优化] 雷达由 5 源裁为 3 源，改为主体直连紧凑 API、不再单开子 Agent：
#   - 删 Product Hunt：连续 3 周（W39→W41）全链路 403，官网+镜像+搜索反复重试零产出，纯烧 credit。
#   - 删 HuggingFace Trending：多为大厂模型发布，已被订阅源 Simon/swyx 覆盖，「新面孔」边际价值低；
#     如某周需要模型侧信号，可用 api_hint 单发一次 JSON 请求补查，不常驻。
#   保留的 3 源贡献了 W41 全部两源触发命中（GitHub=agent skills 集群、HN=CodeMender、即刻=Grok bot）。
radar:
  - id: hacker-news
    name: "Hacker News"
    role: early-radar
    url: https://news.ycombinator.com/
    api_hint: "https://hn.algolia.com/api/v1/search?tags=front_page （紧凑 JSON，直接给 points/comments，勿抓 HTML 首页）"
    scan_focus: "Show HN 新项目、首页反复出现的 AI 工具/demo、高热度讨论串（取 top 3 即可）"

  - id: github-trending
    name: "GitHub Trending"
    role: early-radar
    url: https://github.com/trending?since=weekly
    api_hint: "https://github.com/trending?since=weekly （weekly 视图，取涨星 top 3-5 的 AI/agent/coding 仓库）"
    scan_focus: "本周热门 AI 开源项目（weekly 视图）、agent/evals/coding 工具新面孔"

  - id: jike-ai
    name: "即刻 AI 圈"
    role: early-radar
    url: https://web.okjike.com/
    api_hint: "web.okjike.com 需登录；改用移动端话题页 https://m.okjike.com/topics/63579abb6724cc583b9bba9a （AI探索站），取 top 3"
    scan_focus: "中文 AI 构建者社区热议、国产独立开发者新作品"

# [已移除 2026-10-10] product-hunt — 连续 3 周全链路 403 零产出，成本优化删除
# [已移除 2026-10-10] huggingface-trending — 大厂模型已被 Simon/swyx 覆盖，边际价值低；需要时用 HF API 单发补查

# Automation settings
automation:
  digest_day: friday
  digest_time: "14:00"
  timezone: "Asia/Shanghai"
  output_dir: "digests/"
  format: markdown
  # 遍历窗口：上周五 00:00 至本周四 23:59（共 7 天）
  # 生成锚点为周五，窗口结束次日
  window_start: "prev_friday"   # ISO 周周一 - 3 天
  window_end: "this_thursday"   # ISO 周周一 + 3 天
