  `<span>投资方（归一化后） <b>${DATA.meta.investors}</b></span>`+
  `<span>投资关系 <b>${DATA.meta.edges}</b> 条（领投 ${DATA.meta.lead_edges}）</span>`+
  `<span>融资轮次 <b>${DATA.meta.rounds}</b></span>`+
  `<span>HHI <b>${DATA.meta.hhi}</b></span>`+
  `<span>Top10 投资方占边 <b>${(DATA.meta.top10_edge_share*100).toFixed(1)}%</b></span>`;

// ---------- filters ----------
const state = {tracks:new Set(DATA.tracks.map(t=>t.name)), types:new Set(DATA.types.map(t=>t.name)), minDeg:2, q:""};
const tc = document.getElementById('track-chips');
DATA.tracks.forEach(t=>{
  const el = document.createElement('span'); el.className='chip';
  el.innerHTML = `<span class="dot" style="background:${t.color}"></span>${t.name}`;
  el.onclick = ()=>{ el.classList.toggle('off'); el.classList.contains('off')?state.tracks.delete(t.name):state.tracks.add(t.name); rebuild(); };
  tc.appendChild(el);
});
const yc = document.getElementById('type-chips');
DATA.types.forEach(t=>{
  const el = document.createElement('span'); el.className='chip';
  el.innerHTML = `<span class="sq" style="background:${t.color}"></span>${t.name}`;
  el.onclick = ()=>{ el.classList.toggle('off'); el.classList.contains('off')?state.types.delete(t.name):state.types.add(t.name); rebuild(); };
  yc.appendChild(el);
});
document.getElementById('mindeg').oninput = function(){ state.minDeg = +this.value; document.getElementById('mindeg-val').textContent = '≥'+this.value+' 家'; rebuild(); };
document.getElementById('search').oninput = function(){ state.q = this.value.trim(); applyEmphasis(); };
document.getElementById('showlabels').onchange = ()=>{ d3.selectAll('text.nlabel').style('display', this.checked?null:'none'); };

// ---------- scales ----------
const valR = d3.scaleSqrt().domain([0, 3500]).range([7, 34]);
const degR = d3.scaleSqrt().domain([1, 14]).range([4.5, 17]);

// ---------- svg setup ----------
const svg = d3.select('#graph');
const root = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.25, 5]).on('zoom', ev=>root.attr('transform', ev.transform)));
const linkG = root.append('g'), nodeG = root.append('g'), labelG = root.append('g');
const tooltip = document.getElementById('tooltip');
let simulation = null, nodesAll = [], linksAll = [], selected = null;

function fmtVal(c){ return c.valuation || '未披露'; }

function buildSets(){
  const inv = DATA.investors.filter(v=> v.degree>=state.minDeg && state.types.has(v.type));
  const invSet = new Set(inv.map(v=>v.id));
  const comps = DATA.companies.filter(c=> state.tracks.has(c.track));
  const compSet = new Set(comps.map(c=>c.id));
  const links = DATA.edges.filter(e=> invSet.has(e.source) && compSet.has(e.target)).map(e=>({...e}));
  const usedInv = new Set(links.map(l=>l.source));
  const nodes = comps.map(c=>({...c, kind:'company'})).concat(inv.filter(v=>usedInv.has(v.id)).map(v=>({...v, kind:'investor'})));
  return {nodes, links};
}

function rebuild(){
  const {nodes, links} = buildSets();
  nodesAll = nodes; linksAll = links;
  const wrap = document.getElementById('graph-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;

  linkG.selectAll('*').remove(); nodeG.selectAll('*').remove(); labelG.selectAll('*').remove();
  if (simulation) simulation.stop();

  const link = linkG.selectAll('line').data(links).join('line')
    .attr('stroke', d=> d.lead ? '#c2410c' : '#9aa3b5')
    .attr('stroke-width', d=> d.lead ? 1.8 : 0.7)
    .attr('stroke-opacity', d=> d.lead ? 0.65 : 0.3);

  const node = nodeG.selectAll('g.nd').data(nodes, d=>d.id).join('g').attr('class','nd').style('cursor','pointer');
  node.each(function(d){
    const g = d3.select(this);
    if (d.kind==='company'){
      const r = d.val_rmb!=null ? valR(d.val_rmb) : 7;
      d.r = r;
      g.append('circle').attr('r', r).attr('fill', trackColor[d.track])
        .attr('fill-opacity', .88).attr('stroke', d.val_rmb==null ? '#6b7280' : '#fff').attr('stroke-width', d.val_rmb==null?1.2:1.5)
        .attr('stroke-dasharray', d.val_rmb==null ? '3,2' : null);
    } else {
      const r = degR(d.degree); d.r = r;
      g.append('rect').attr('x',-r).attr('y',-r).attr('width',2*r).attr('height',2*r).attr('rx', r*0.28)
        .attr('fill', typeColor[d.type]).attr('fill-opacity', .9).attr('stroke','#fff').attr('stroke-width',1.2);
    }
  });

  const label = labelG.selectAll('text').data(nodes, d=>d.id).join('text')
    .attr('class', d=> 'nlabel' + ((d.kind==='company'&&d.val_rmb>600)||(d.kind==='investor'&&d.degree>=7)?' big':''))
    .attr('text-anchor','middle')
    .text(d=> d.short || d.name);

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(d=> d.lead?80:95).strength(d=> d.lead?0.5:0.18))
    .force('charge', d3.forceManyBody().strength(d=> d.kind==='company'? -520 : -210))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collide', d3.forceCollide(d=> (d.r||6)+9))
    .force('x', d3.forceX(W/2).strength(0.045))
    .force('y', d3.forceY(H/2).strength(0.055));

  simulation.on('tick', ()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform', d=>`translate(${d.x},${d.y})`);
    label.attr('x',d=>d.x).attr('y',d=> d.y + (d.r||6) + 11);
  });

  node.call(d3.drag()
    .on('start',(ev,d)=>{ if(!ev.active) simulation.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
    .on('end',(ev,d)=>{ if(!ev.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

  node.on('mouseover',(ev,d)=>{ tooltip.innerHTML = tipHTML(d); tooltip.style.opacity=1; })
      .on('mousemove',(ev)=>{ const b=document.getElementById('graph-wrap').getBoundingClientRect();
        tooltip.style.left = Math.min(ev.clientX-b.left+14, b.width-345)+'px'; tooltip.style.top = (ev.clientY-b.top+12)+'px'; })
      .on('mouseout',()=>{ tooltip.style.opacity=0; })
      .on('click',(ev,d)=>{ ev.stopPropagation(); selected = d.id; highlight(); showDetail(d); });

  svg.on('click', ()=>{ selected=null; highlight(); defaultDetail(); });
  applyEmphasis();
  if (selected) highlight();
}

function tipHTML(d){
  if (d.kind==='company'){
    return `<div class="tt-title">${d.name}</div>
      <div>${d.track} · ${d.founder_type||''}</div>
      <div>创始人：${d.founder||'—'}</div>
      <div>估值/市值：${fmtVal(d)}</div>
      <div class="muted">点击查看融资轮次与全部投资方</div>`;
  }
  return `<div class="tt-title">${d.name}</div>
    <div>类型：${d.type} ｜ 覆盖档案公司 ${d.degree} 家</div>
    <div>资金规模：${d.fund_size||'未披露'}</div>
    ${d.note?`<div class="muted">${d.note}</div>`:''}`;
}

function neighborsOf(id){
  const nb = new Set([id]);
  linksAll.forEach(l=>{ const s=l.source.id||l.source, t=l.target.id||l.target;
    if (s===id) nb.add(t); if (t===id) nb.add(s); });
  return nb;
}

function highlight(){
  if (!selected){
    nodeG.selectAll('g.nd').style('opacity',1);
    linkG.selectAll('line').attr('stroke-opacity', d=> d.lead?0.65:0.3);
    labelG.selectAll('text').style('opacity',1);
    return;
  }
  const nb = neighborsOf(selected);
  nodeG.selectAll('g.nd').style('opacity', d=> nb.has(d.id)?1:0.12);
  labelG.selectAll('text').style('opacity', d=> nb.has(d.id)?1:0.1);
  linkG.selectAll('line').attr('stroke-opacity', l=>{
    const s=l.source.id||l.source, t=l.target.id||l.target;
    return (s===selected||t===selected) ? (l.lead?0.9:0.6) : 0.04;
  });
}

function applyEmphasis(){
  const q = state.q.toLowerCase();
  if (!q){ if(!selected) highlight(); return; }
  nodeG.selectAll('g.nd').style('opacity', d=> (d.name.toLowerCase().includes(q)||(d.short||'').toLowerCase().includes(q)) ? 1 : 0.12);
  labelG.selectAll('text').style('opacity', d=> (d.name.toLowerCase().includes(q)||(d.short||'').toLowerCase().includes(q)) ? 1 : 0.1);
  linkG.selectAll('line').attr('stroke-opacity', 0.06);
}

// ---------- detail panel ----------
const detail = document.getElementById('detail');
function badge(name, color){ return `<span class="badge" style="background:${color}">${name}</span>`; }

function defaultDetail(){
  detail.innerHTML = `<h2>图谱说明</h2>
  <div class="card">
    <div>这是一张 <b>投资方（方形）× 公司（圆形）</b> 的二分网络图：</div>
    <div>· 圆形 = 科创公司，颜色=赛道，大小≈最新可核实估值/市值（虚线圈=未披露）；</div>
    <div>· 方形 = 投资方，颜色=机构类型，大小≈覆盖档案库公司数；</div>
    <div>· <span style="color:#c2410c;font-weight:600">橙色实线</span>=领投轮次，灰色细线=参投；</div>
    <div>· 点击任一节点，可在此栏查看融资轮次、投资方背景与完整组合。</div>
  </div>`;
}

function showDetail(d){
  if (d.kind==='company'){ showCompany(d); } else { showInvestor(d); }
}

function showCompany(c){
  const edges = DATA.edges.filter(e=> e.target===c.id).sort((a,b)=> (b.lead-a.lead));
  const leads = edges.filter(e=>e.lead), joins = edges.filter(e=>!e.lead);
  const extra = (c.minor_investors&&c.minor_investors.length) ? `<h3>其他参投方（仅参投 1 家档案公司，未入图）</h3><div class="inv-list">${c.minor_investors.map(n=>`<span>${n}</span>`).join('')}</div>` : '';
  detail.innerHTML = `
    <h2>${c.name}</h2>
    <div style="margin-bottom:6px">${badge(c.track, trackColor[c.track])}<span class="badge" style="background:#64748b">${c.founder_type||'—'}</span></div>
    <div class="card">
      <div class="kv"><b>创始人：</b>${c.founder||'—'}</div>
      <div class="kv"><b>估值/市值：</b>${fmtVal(c)}</div>
      <div class="kv"><b>状态：</b>${c.status||'—'}</div>
    </div>
    ${leads.length?`<h3>领投方（${leads.length}）</h3><div class="inv-list">${leads.map(e=>`<span class="lead" onclick="jump('${e.source}')">${e.source}${e.rounds.length?'：'+e.rounds.join('、'):''}</span>`).join('')}</div>`:''}
    ${joins.length?`<h3>参投方（${joins.length}）</h3><div class="inv-list">${joins.map(e=>`<span onclick="jump('${e.source}')">${e.source}${e.rounds.length?'：'+e.rounds.join('、'):''}</span>`).join('')}</div>`:''}
    ${extra}`;
}

function showInvestor(v){
  const edges = DATA.edges.filter(e=> e.source===v.id).sort((a,b)=> (b.lead-a.lead));
  const trackStr = Object.entries(v.deg_track||{}).map(([k,n])=>`${k.replace('/基础模型','').replace('/Agent','').replace('/机器人','')} ${n}`).join(' ｜ ');
  detail.innerHTML = `
    <h2>${v.name}</h2>
    <div style="margin-bottom:6px">${badge(v.type, typeColor[v.type]||'#64748b')}</div>
    <div class="card">
      <div class="kv"><b>资金规模：</b>${v.fund_size||'未披露'}</div>
      <div class="kv"><b>覆盖档案公司：</b>${v.degree} 家（${trackStr}）</div>
      ${v.note?`<div class="kv"><b>备注：</b>${v.note}</div>`:''}
    </div>
    <h3>投资组合（领投 ${edges.filter(e=>e.lead).length} / 参投 ${edges.filter(e=>!e.lead).length}）</h3>
    <div class="inv-list">${edges.map(e=>`<span class="${e.lead?'lead':''}" onclick="jump('${e.target}')">${(e.target_short||e.target)}${e.lead?'（领投'+(e.rounds.length?'：'+e.rounds.join('、'):'')+'）':(e.rounds.length?'（'+e.rounds.join('、')+'）':'')}</span>`).join('')}</div>`;
}

window.jump = function(id){
  const d = nodesAll.find(n=>n.id===id);
  if (!d){ // target hidden by filter; fallback: look up static data
    const c = DATA.companies.find(x=>x.id===id); const v = DATA.investors.find(x=>x.id===id);
    if (c) showCompany(c); else if (v) showInvestor(v);
    return;
  }
  selected = id; highlight(); showDetail(d);
};

// ---------- top bars ----------
const tb = document.getElementById('topbars');
const maxDeg = Math.max(...DATA.top15.map(r=>r[1]));
DATA.top15.forEach(([name,deg])=>{
  const v = DATA.investors.find(x=>x.name===name);
  const color = v? (typeColor[v.type]||'#94a3b8') : '#94a3b8';
  const row = document.createElement('div'); row.className='bar-row';
  row.innerHTML = `<span class="nm" title="${name}">${name}</span><span class="bar" style="width:${deg/maxDeg*210}px;background:${color}"></span><span class="vv">${deg} 家</span>`;
  row.onclick = ()=>jump(name);
  tb.appendChild(row);
});

defaultDetail();
rebuild();
window.addEventListener('resize', ()=>{ if (simulation) simulation.force('center', d3.forceCenter(document.getElementById('graph-wrap').clientWidth/2, document.getElementById('graph-wrap').clientHeight/2)).alpha(0.3).restart(); });
</script>
</body>
</html>
